[project]
name = "biz-db-mcp"
version = "0.3.0"
description = "MCP server for institution-isolated MySQL reads, file exports, and whitelisted imports."
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.29.0,<2.0.0",
  "pymysql>=1.1.0",
  "sqlparse>=0.5.0",
  "pyarrow>=17.0.0",
  "sqlglot>=30.24.0,<31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
biz-db-mcp = "biz_db_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["biz_db_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
